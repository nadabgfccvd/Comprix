version: 2
updates:
  # Actions do workflow (checkout, setup-java, upload-artifact, setup-gradle…)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependências Gradle/AGP/Kotlin/AndroidX (build.gradle.kts raiz e app/)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Exigem troca de toolchain, não só bump: AGP 9 pede Gradle 9;
      # core-ktx 1.17+ pede compileSdk 36; coroutines 1.11+ e navigation 2.9+
      # são compilados com Kotlin 2.1/2.2 (metadata incompatível com 2.0.21).
      # A migração é uma rodada própria (issue #5 rastreia o AGP).
      - dependency-name: "com.android.application"
        versions: [">=8.10.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.17.0"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-android"
        versions: [">=1.11.0"]
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-coroutines-test"
        versions: [">=1.11.0"]
      - dependency-name: "androidx.navigation:navigation-compose"
        versions: [">=2.9.0"]
      # Gradle 9 exige AGP 8.11+/9 + migração de DSL — rodada própria.
      - dependency-name: "gradle-wrapper"
        versions: [">=9.0.0"]
      # Plugin compose e KSP são acoplados à versão do kotlin-android (2.0.21);
      # bumpar sozinhos quebra o build.
      - dependency-name: "org.jetbrains.kotlin.plugin.compose"
        versions: [">=2.1.0"]
      - dependency-name: "org.jetbrains.kotlin.android"
        versions: [">=2.1.0"]
      - dependency-name: "com.google.devtools.ksp"
        versions: [">=2.1.0"]
