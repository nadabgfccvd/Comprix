version: 2
updates:
  # Actions do workflow (checkout, setup-java, upload-artifact, setup-gradle…)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Dependências Gradle/AGP/Kotlin/AndroidX (build.gradle.kts raiz e app/)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
