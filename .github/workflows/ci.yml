name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Testes, lint e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes unitários (JVM)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (erros falham o CI)
        run: ./gradlew lintDebug

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: comprix-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar relatórios em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-falha
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.*
