# ---------------------------------------------------------------------------
# Configuracao de build do Comprix.
# Ajustada para maquinas modestas: um unico JVM (Kotlin compila in-process),
# evitando dois daemons concorrendo por memoria.
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.workers.max=1

kotlin.code.style=official
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.defaults.buildfeatures.resvalues=true
